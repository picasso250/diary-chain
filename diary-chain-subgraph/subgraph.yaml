specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: OnChainDiary
    network: arbitrum-one
    source:
      address: "0x09e8c43372CB00eC109D029e321dC7FFf0bb1e28"
      abi: OnChainDiary
      startBlock: 419201926
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Entry
      abis:
        - name: OnChainDiary
          file: ./abis/OnChainDiary.json
      eventHandlers:
        - event: EntryCreated(indexed address,uint256,string)
          handler: handleEntryCreated
      file: ./src/on-chain-diary.ts
