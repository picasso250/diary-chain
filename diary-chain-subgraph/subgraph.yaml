specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: OnChainDiary
    network: mainnet
    source:
      address: "0x493e084c3959d2728a3277c18ee47ffcc41eff24"
      abi: OnChainDiary
      startBlock: 26108868
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Entry
      abis:
        - name: OnChainDiary
          file: ./abis/OnChainDiary.json
      eventHandlers:
        - event: EntryCreated(indexed address,string)
          handler: handleEntryCreated
      file: ./src/on-chain-diary.ts
